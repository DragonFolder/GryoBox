<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tilt Box</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; touch-action: none;
    font-family: system-ui, -apple-system, sans-serif; color: #e8ecf3; -webkit-user-select: none; user-select: none; }
  canvas { display: block; }
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: rgba(11,13,18,.92); z-index: 10; text-align: center; padding: 24px; }
  #start h1 { margin: 0; font-size: 28px; letter-spacing: .5px; }
  #start p { margin: 0; max-width: 320px; opacity: .7; line-height: 1.45; font-size: 15px; }
  button { font: inherit; border: 0; border-radius: 999px; padding: 12px 22px; background: #f2a541; color: #1a1205;
    font-weight: 600; font-size: 16px; }
  #hud { position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; align-items: center;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); font-size: 12px; font-variant-numeric: tabular-nums;
    background: linear-gradient(transparent, rgba(0,0,0,.55)); pointer-events: none; }
  #hud { flex-wrap: wrap; gap: 8px; }
  #hud .btns { display: flex; flex-wrap: wrap; gap: 8px; pointer-events: auto; }
  #hud button { padding: 7px 12px; font-size: 12px; background: rgba(255,255,255,.12); color: #e8ecf3; }
  #hud button.on { background: #f2a541; color: #1a1205; }
  #hud .left { display: flex; flex-direction: column; gap: 6px; pointer-events: auto; }
  #hud label { display: flex; align-items: center; gap: 8px; }
  #hud input[type=range] { width: 110px; accent-color: #f2a541; }
  #readout.ff { color: #7fe0ff; font-weight: 600; }
</style>
</head>
<body>
<div id="start">
  <h1>Tilt Box</h1>
  <p>Tilt your phone to roll the ball around a box inside the screen. Shake it to make it bounce.</p>
  <button id="go">Tap to start</button>
  <p id="msg" style="font-size:13px"></p>
</div>
<div id="hud">
  <div class="left">
    <span id="readout">–</span>
    <label>Box size <input id="scale" type="range" min="1" max="5" step="0.25"> <span id="scaleVal"></span></label>
    <label>Speed <input id="time" type="range" min="0.25" max="1" step="0.05"> <span id="timeVal"></span></label>
  </div>
  <div class="btns">
    <button id="ballBtn"></button>
    <button id="head">Head</button>
    <button id="mute" class="on">Sound</button>
    <button id="flip">Invert</button>
    <button id="reset">Reset</button>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ---------- Tunables ----------
// Real-world scale: the box is 2 units tall and matches the screen's physical height, so
// upm (world units per metre) = 2 / screen height in metres. It's measured from the screen in
// resize(). Phones lay out CSS pixels at roughly 160 per inch (Android dp / iOS points).
// One scale is used for gravity AND shakes on purpose: if they differed, free fall (where the
// phone's acceleration exactly cancels gravity) wouldn't cancel, and the ball would get launched.
const CSS_PX_PER_INCH = 160;
const SIZE_DEFAULT  = 1;     // "Box size" slider: 1 = real screen size, 2 = acts twice as big, …
const SPIN_SCALE    = 1;     // rotation effects (gyro): 1 = physically correct, 0 = off
const SENSOR_TC     = 0.012; // s, tiny smoothing on sensor input (just evens out 60 Hz steps)
const DRAG_TC       = 0.08;  // s, smoothing for the desktop drag-to-tilt fallback
const WALL_FRICTION = 2.0;   // slows sliding along a wall in contact
const AIR_DRAG      = 0.05;  // small linear damping (per second) so nothing drifts forever
const BALL_R        = 0.22;
const DEPTH         = 0.55;  // half-depth of the box (into the screen); 1 = half the screen height
// Ball types. Mass alone doesn't change how a ball falls; what makes one *feel* light or heavy is:
//   bounce   – coefficient of restitution (share of speed kept after a hit)
//   grip     – wall friction coefficient (rolls vs slides)
//   inertia  – moment of inertia as a fraction of m·R² (solid 2/5, hollow shell 2/3: rolls slower)
//   drag     – air drag, k in a = k·v² (m⁻¹). Matters for light balls: ping-pong ≈ 0.14, rubber ≈ 0.015
//   squish   – how much it deforms on impact (multiplies IMPACT_SQUISH)
//   pitch    – multiplies the bounce sound's pitch
const BALLS = [
  { name: 'Rubber',    bounce: 0.78, grip: 0.6,  inertia: 2 / 5, drag: 0.015, squish: 1.0,  pitch: 1.0, colors: ['#f2a541', '#c4462f'] },
  { name: 'Ping-pong', bounce: 0.88, grip: 0.25, inertia: 2 / 3, drag: 0.14,  squish: 0.25, pitch: 3.2, colors: ['#f4f1ea', '#f08a24'] },
  { name: 'Marble',    bounce: 0.5,  grip: 0.35, inertia: 2 / 5, drag: 0,     squish: 0.12, pitch: 2.2, colors: ['#5fb3d9', '#1d4e89'] },
];
const VIEW_DIST_M   = 0.30;  // assumed eye distance from the screen (m) when head tracking is off

// Head tracking (front camera). These are guesses about the phone's camera; adjust if the view feels off.
const CAM_FOV_DEG   = 70;    // front camera's field of view across the LONGER side of its image
const CAM_OFFSET_M  = 0.008; // front camera sits this far beyond the top edge of the screen (portrait)
const EYE_GAP_M     = 0.063; // average distance between a person's pupils
const EYE_SMOOTH_TC = 0.08;  // s, smoothing of the tracked eye position (higher = steadier, laggier)
const MP_VER        = '0.10.14'; // @mediapipe/tasks-vision version
const TIME_DEFAULT  = 0.35;  // "Speed" slider: 1 = real time, 0.5 = half-speed slow motion

// Squash & stretch (purely visual — doesn't change the physics).
// Speeds here are real-world m/s, so the look doesn't change with the box size.
const SQUISH_STIFF  = 600;   // spring stiffness: higher = faster wobble
const SQUISH_DAMP   = 12;    // spring damping: lower = wobbles longer
const IMPACT_SQUISH = 3.5;   // how much a wall hit compresses the ball, per m/s of impact (1 m/s ≈ 15%)
const REST_SQUISH   = 0.06;  // flattening while resting against a wall at 1 g
const MAX_SQUISH    = 0.35;  // clamp so it never pancakes
const STRETCH       = 0.08;  // elongation along velocity, per m/s
const MAX_STRETCH   = 0.12;

// ---------- Renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d12);
const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 50);

scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const lamp = new THREE.PointLight(0xfff1dc, 30, 0, 2);
lamp.castShadow = true;
lamp.shadow.mapSize.set(1024, 1024);
lamp.shadow.bias = -0.002;
scene.add(lamp);

// Grid texture for the walls so depth reads clearly
function gridTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = '#1b2130'; x.fillRect(0, 0, 256, 256);
  x.strokeStyle = '#3a4560'; x.lineWidth = 3;
  x.strokeRect(0, 0, 256, 256);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// Ball with a pattern so you can see it roll
let ballIndex = 0;
try { const i = parseInt(localStorage.getItem('gyrobox-ball'), 10); if (BALLS[i]) ballIndex = i; } catch {}
let ballType = BALLS[ballIndex];

function ballTexture([base, check] = ballType.colors) {
  const c = document.createElement('canvas'); c.width = 512; c.height = 256;
  const x = c.getContext('2d');
  x.fillStyle = base; x.fillRect(0, 0, 512, 256);
  x.fillStyle = check;
  for (let i = 0; i < 8; i++) for (let j = 0; j < 4; j++)
    if ((i + j) % 2) x.fillRect(i * 64, j * 64, 64, 64);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

const ball = new THREE.Mesh(
  new THREE.SphereGeometry(BALL_R, 48, 32),
  new THREE.MeshStandardMaterial({ map: ballTexture(), roughness: 0.35, metalness: 0.1 })
);
ball.castShadow = true;
ball.matrixAutoUpdate = false; // we compose position * squash * rotation ourselves
scene.add(ball);

let room = null;
const half = new THREE.Vector3(1, 1, DEPTH); // box half-extents, x set from aspect

function buildRoom() {
  if (room) { scene.remove(room); room.geometry.dispose(); room.material.forEach(m => { m.map?.dispose(); m.dispose(); }); }
  const tex = gridTexture();
  // BoxGeometry face order: +x, -x, +y, -y, +z (front = screen, hidden), -z (back)
  const reps = [[DEPTH*2, 2], [DEPTH*2, 2], [half.x*2, DEPTH*2], [half.x*2, DEPTH*2], [1,1], [half.x*2, 2]];
  const mats = reps.map(([u, v], i) => {
    const t = tex.clone(); t.needsUpdate = true; t.repeat.set(Math.round(u * 2.5), Math.round(v * 2.5));
    const m = new THREE.MeshStandardMaterial({ map: t, side: THREE.BackSide, roughness: 0.9 });
    if (i === 4) m.visible = false;
    return m;
  });
  room = new THREE.Mesh(new THREE.BoxGeometry(half.x * 2, half.y * 2, half.z * 2), mats);
  room.receiveShadow = true;
  scene.add(room);
}

function resize() {
  const w = innerWidth, h = innerHeight, aspect = w / h;
  renderer.setSize(w, h);
  camera.aspect = aspect;
  half.x = aspect * half.y;
  updateScale();
  // The camera itself is placed every frame by updateView() (see Head tracking)
  lamp.position.set(0, half.y * 0.6, half.z - 0.15);
  buildRoom();
  clampBall();
}

// ---------- Input: acceleration felt by the ball ----------
// Device coords: x right, y up, z out of the screen — the same as three.js camera space here.
// accelerationIncludingGravity is the phone's "specific force" (its own acceleration minus gravity).
// A loose ball inside the phone accelerates, relative to the phone, by exactly -reading: gravity
// when held still, thrown around when shaken, ~0 (floating) in free fall.
const gTarget = new THREE.Vector3(0, -9.8, 0); // latest reading, as acceleration on the ball (m/s²)
const g = gTarget.clone();                      // what the physics uses this step
const omega = new THREE.Vector3();              // phone rotation rate in screen coords (rad/s)
const dOmega = new THREE.Vector3();             // change in omega not yet applied to the ball
const omegaNew = new THREE.Vector3();
let invert = false;
let gotSensor = false;
let boxSize = SIZE_DEFAULT;
try { const v = parseFloat(localStorage.getItem('gyrobox-size')); if (v > 0) boxSize = v; } catch {}
let upm = 15; // world units per metre; set properly by updateScale()
function updateScale() {
  const screenM = (innerHeight / CSS_PX_PER_INCH) * 0.0254;
  upm = (half.y * 2) / (screenM * boxSize);
}

function screenAngle() {
  const a = (screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0;
  return THREE.MathUtils.degToRad(a);
}

function onMotion(e) {
  const a = e.accelerationIncludingGravity;
  if (!a || a.x == null) return;
  gotSensor = true;
  // Rotate device x/y into screen x/y when the screen is rotated
  const th = screenAngle(), c = Math.cos(th), s = Math.sin(th);
  const sx = c * a.x - s * a.y, sy = s * a.x + c * a.y;
  const sign = invert ? 1 : -1;
  gTarget.set(sign * sx, sign * sy, sign * a.z);

  // Gyro: beta = about x, gamma = about y, alpha = about z (deg/s)
  const r = e.rotationRate;
  if (r && r.alpha != null) {
    const D = Math.PI / 180;
    const wx = (r.beta || 0) * D, wy = (r.gamma || 0) * D, wz = (r.alpha || 0) * D;
    omegaNew.set(c * wx - s * wy, s * wx + c * wy, wz);
    dOmega.add(omegaNew).sub(omega);
    omega.copy(omegaNew);
  }
}

// Desktop / no-sensor fallback: drag to tilt
let dragging = false;
addEventListener('pointerdown', e => { if (!gotSensor && e.target === renderer.domElement) { dragging = true; onDrag(e); } });
addEventListener('pointermove', e => { if (dragging) onDrag(e); });
addEventListener('pointerup', () => { dragging = false; });
function onDrag(e) {
  const nx = (e.clientX / innerWidth) * 2 - 1, ny = -((e.clientY / innerHeight) * 2 - 1);
  gTarget.set(nx * 9.8, ny * 9.8, -4).clampLength(0, 9.8);
}

// ---------- Physics ----------
const pos = new THREE.Vector3(0, 0, 0);
const vel = new THREE.Vector3();
const axes = ['x', 'y', 'z'];

// Per-axis squash springs. squash[k] > 0 = compressed along world axis k.
const squash = new THREE.Vector3();
const squashVel = new THREE.Vector3();
const squashSide = new THREE.Vector3(1, 1, 1); // which wall (+1/-1) each axis last touched
const pressing = new THREE.Vector3();          // how hard gravity pushes into a touched wall (0..1)
const touching = new THREE.Vector3();          // per axis: wall side (+1/-1) the ball is resting on, or 0
const spin = new THREE.Vector3();              // ball's angular velocity relative to the box (rad/s)
let timeScale = TIME_DEFAULT;
try { const v = parseFloat(localStorage.getItem('gyrobox-time')); if (v > 0) timeScale = v; } catch {}
let stretch = 0;
let frameImpact = 0; // hardest wall hit this frame (m/s), for sound

// ---------- Sound (synthesized with Web Audio, no files) ----------
const BOUNCE_MIN   = 0.06; // m/s: impacts slower than this are silent and don't squish
const BOUNCE_FULL  = 1.5;  // m/s: impact speed that plays at full volume
const BOUNCE_VOL   = 0.6;
const ROLL_VOL     = 0.045; // max volume of the rolling rumble
const ROLL_MAX_HZ  = 900;   // cap on how bright the rumble gets (higher = more hissy "swish")
let actx = null, master, rollGain, rollFilter, noiseBuf;
let soundOn = true;

function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  master = actx.createGain();
  master.gain.value = soundOn ? 1 : 0;
  master.connect(actx.destination);

  // 2 s of white noise, reused for the hit "thwack" and the rolling rumble
  noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
  const data = noiseBuf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;

  // Rolling: looping noise through a low-pass whose cutoff and volume follow ball speed
  const roll = actx.createBufferSource();
  roll.buffer = noiseBuf; roll.loop = true;
  rollFilter = actx.createBiquadFilter();
  rollFilter.type = 'lowpass'; rollFilter.frequency.value = 200; rollFilter.Q.value = 1.5;
  rollGain = actx.createGain(); rollGain.gain.value = 0;
  roll.connect(rollFilter).connect(rollGain).connect(master);
  roll.start();
}

function playBounce(speed) {
  if (!actx || !soundOn) return;
  const amt = Math.min(1, (speed - BOUNCE_MIN) / (BOUNCE_FULL - BOUNCE_MIN));
  if (amt <= 0) return;
  const t = actx.currentTime;

  // Rubbery "boing": a sine that drops in pitch, higher for harder hits
  const osc = actx.createOscillator();
  osc.type = 'sine';
  const p = ballType.pitch;
  osc.frequency.setValueAtTime((130 + amt * 140 + Math.random() * 20) * p, t);
  osc.frequency.exponentialRampToValueAtTime(55 * p, t + 0.18 / Math.sqrt(p));
  const og = actx.createGain();
  og.gain.setValueAtTime(0.0001, t);
  og.gain.linearRampToValueAtTime(BOUNCE_VOL * amt, t + 0.005);
  og.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
  osc.connect(og).connect(master);
  osc.start(t); osc.stop(t + 0.3);

  // Short filtered-noise "thwack" for the contact itself
  const n = actx.createBufferSource();
  n.buffer = noiseBuf;
  const nf = actx.createBiquadFilter();
  nf.type = 'lowpass'; nf.frequency.value = 900 + amt * 1800;
  const ng = actx.createGain();
  ng.gain.setValueAtTime(0.35 * amt, t);
  ng.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
  n.connect(nf).connect(ng).connect(master);
  n.start(t, Math.random() * 1.5, 0.08);
}

function updateRollSound() {
  if (!actx) return;
  const onWall = pressing.x + pressing.y + pressing.z > 0;
  const speed = vel.length() / upm; // m/s
  const t = actx.currentTime;
  rollGain.gain.setTargetAtTime(onWall ? Math.min(speed * 0.08, ROLL_VOL) : 0, t, 0.05);
  rollFilter.frequency.setTargetAtTime(Math.min(120 + speed * 600, ROLL_MAX_HZ), t, 0.05);
}

function clampBall() {
  for (const k of axes) pos[k] = THREE.MathUtils.clamp(pos[k], -half[k] + BALL_R, half[k] - BALL_R);
}

const tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3(), wSpin = new THREE.Vector3();

function step(dt) {
  if (gotSensor) {
    // A world-fixed direction (gravity) turns the opposite way in phone coords as the phone rotates.
    // Rotating the last reading by the gyro keeps fast tilts from lagging behind.
    g.addScaledVector(tmpA.crossVectors(omega, g), -dt);
  }
  g.lerp(gTarget, 1 - Math.exp(-dt / (gotSensor ? SENSOR_TC : DRAG_TC)));
  vel.addScaledVector(g, upm * dt);

  // The box is a rotating frame, so the ball also feels the fictitious forces of rotation.
  // (These are unit-free, so they don't depend on the box scale.)
  wSpin.copy(omega).multiplyScalar(SPIN_SCALE);
  if (SPIN_SCALE) {
    // Euler: a sudden change in spin swings the walls into the ball (applied as an impulse)
    if (dOmega.lengthSq() > 0) {
      vel.addScaledVector(tmpA.crossVectors(dOmega, pos), -SPIN_SCALE);
      // The ball's own spin doesn't change, so relative to the box it gains the opposite spin
      spin.addScaledVector(dOmega, -SPIN_SCALE);
      dOmega.set(0, 0, 0);
    }
    // Coriolis (-2ω×v) and centrifugal (-ω×(ω×r))
    vel.addScaledVector(tmpA.crossVectors(wSpin, vel), -2 * dt);
    vel.addScaledVector(tmpB.crossVectors(wSpin, tmpA.crossVectors(wSpin, pos)), -dt);
  } else {
    dOmega.set(0, 0, 0);
  }

  // Air drag a = k·v² (real units), i.e. velocity decays at a rate of k·(speed in m/s) per second
  vel.multiplyScalar(1 - (AIR_DRAG + ballType.drag * (vel.length() / upm)) * dt);
  spin.multiplyScalar(1 - AIR_DRAG * dt);
  pos.addScaledVector(vel, dt);

  pressing.set(0, 0, 0);
  for (const k of axes) {
    const lim = half[k] - BALL_R;
    if (Math.abs(pos[k]) >= lim - 1e-6) {          // at (or past) a wall
      const dir = Math.sign(pos[k]);
      pos[k] = dir * lim;
      const into = vel[k] * dir;
      if (into > 0) {
        vel[k] = -vel[k] * ballType.bounce;
        // Only a real arrival counts as a hit. While the ball rests on this wall, gravity pushes it
        // in a little every step; those aren't impacts and shouldn't squish or make sound.
        const hit = into / upm; // m/s
        if (touching[k] !== dir && hit > BOUNCE_MIN) {
          squashVel[k] += hit * IMPACT_SQUISH * ballType.squish; // kick the squash spring
          frameImpact = Math.max(frameImpact, hit);
        }
      }
      // Settle instead of jittering: anything gravity alone would build up in a couple of steps
      if (Math.abs(vel[k]) < Math.max(0.01 * upm, Math.abs(g[k]) * upm * dt * 2)) vel[k] = 0;
      touching[k] = dir;
      if (into > 0) applyGrip(k, dir, into - vel[k] * dir);
      for (const o of axes) if (o !== k) vel[o] *= 1 - WALL_FRICTION * 0.1 * dt;
      squashSide[k] = dir;
      pressing[k] = Math.max(0, g[k] * dir) / 9.8;
    } else {
      touching[k] = 0;
    }
  }

  // Damped springs pull each axis' squash toward its resting flatten amount
  for (const k of axes) {
    const target = REST_SQUISH * pressing[k];
    squashVel[k] += (-SQUISH_STIFF * (squash[k] - target) - SQUISH_DAMP * squashVel[k]) * dt;
    squash[k] = THREE.MathUtils.clamp(squash[k] + squashVel[k] * dt, -MAX_SQUISH * 0.6, MAX_SQUISH);
  }
  const stretchTarget = Math.min((vel.length() / upm) * STRETCH, MAX_STRETCH);
  stretch += (stretchTarget - stretch) * Math.min(1, dt * 12);

  // Turn the ball by its actual spin
  const w = spin.length();
  if (w > 1e-4) ball.rotateOnWorldAxis(tmpA.copy(spin).divideScalar(w), w * dt);
}

// Friction at the contact point: makes the ball roll instead of slide, and lets spin carry through
// bounces. Treats the ball as a solid sphere (moment of inertia 2/5·m·R²): to stop the contact point
// slipping, friction removes 2/7 of the slip from the ball's velocity and turns the rest into spin —
// which is why a rolling ball speeds up at only 5/7 the rate a sliding one would.
// normalDv = how much velocity the wall just took out along its normal (limits friction, Coulomb-style).
const rc = new THREE.Vector3(), slip = new THREE.Vector3(), dv = new THREE.Vector3();
function applyGrip(k, dir, normalDv) {
  rc.set(0, 0, 0); rc[k] = dir * BALL_R;            // centre -> contact point
  slip.crossVectors(spin, rc).add(vel); slip[k] = 0; // contact-point velocity along the wall
  const beta = ballType.inertia;                     // I = beta·m·R²
  dv.copy(slip).multiplyScalar(-beta / (1 + beta));  // solid: 2/7, hollow: 2/5
  const maxDv = ballType.grip * normalDv;
  if (dv.length() > maxDv) dv.setLength(maxDv);      // not enough grip: it partly slides
  vel.add(dv);
  spin.addScaledVector(tmpB.crossVectors(rc, dv), 1 / (beta * BALL_R * BALL_R));
}

// Build ball.matrix = translate * deform * rotate. The deform is a symmetric 3x3 in world space,
// so the ball squashes against walls/velocity regardless of how it has rolled.
const rotM = new THREE.Matrix4();
const vDir = new THREE.Vector3();
function updateBallMatrix() {
  // Axis squash, roughly volume-preserving: compress one axis, bulge the other two by half as much
  const sx = squash.x, sy = squash.y, sz = squash.z;
  const d = [1 - sx + (sy + sz) / 2, 1 - sy + (sx + sz) / 2, 1 - sz + (sx + sy) / 2];
  // Stretch along velocity: +s along v̂, -s/2 across it  =>  -s/2·I + 1.5s·v̂v̂ᵀ
  if (vel.lengthSq() > 1e-6) vDir.copy(vel).normalize(); else vDir.set(0, 0, 0);
  const s = stretch, a = 1.5 * s;
  const m = [
    [d[0] - s / 2 + a * vDir.x * vDir.x, a * vDir.x * vDir.y, a * vDir.x * vDir.z],
    [a * vDir.y * vDir.x, d[1] - s / 2 + a * vDir.y * vDir.y, a * vDir.y * vDir.z],
    [a * vDir.z * vDir.x, a * vDir.z * vDir.y, d[2] - s / 2 + a * vDir.z * vDir.z],
  ];
  // Shift the centre toward the wall being squashed into so the ball stays in contact with it
  const px = pos.x + squashSide.x * BALL_R * sx;
  const py = pos.y + squashSide.y * BALL_R * sy;
  const pz = pos.z + squashSide.z * BALL_R * sz;
  ball.matrix.set(
    m[0][0], m[0][1], m[0][2], px,
    m[1][0], m[1][1], m[1][2], py,
    m[2][0], m[2][1], m[2][2], pz,
    0, 0, 0, 1
  );
  ball.matrix.multiply(rotM.makeRotationFromQuaternion(ball.quaternion));
  ball.matrixWorldNeedsUpdate = true;
}

// ---------- Head tracking: the screen as a window into the box ----------
// Positions here are in "screen space", in metres: origin at the screen centre, x right, y up,
// z out of the screen toward the viewer. The camera is put at your eye and its view is skewed
// (an off-axis frustum) so the screen's edges are exactly the box's front opening.
const headBtn = document.getElementById('head');
let headOn = false, headLoading = false;
let detector = null, video = null, stream = null, lastVideoTime = -1, lastFaceAt = -1e9;
const eyeDefault = new THREE.Vector3(0, 0, VIEW_DIST_M);
const eye = eyeDefault.clone();          // smoothed estimate, used to render
const eyeMeasured = eyeDefault.clone();  // latest camera measurement (kept turning with the gyro)
const tmpE = new THREE.Vector3();

async function startHead() {
  headLoading = true; headBtn.textContent = 'Head…';
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: false });
    video = document.createElement('video');
    video.playsInline = true; video.muted = true; video.srcObject = stream;
    await video.play();
    if (!detector) {
      // Loaded only when first switched on. Runs entirely on the phone; no video is sent anywhere.
      const base = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MP_VER}`;
      const { FilesetResolver, FaceDetector } = await import(`${base}/vision_bundle.mjs`);
      const files = await FilesetResolver.forVisionTasks(`${base}/wasm`);
      const opts = delegate => ({
        baseOptions: { delegate, modelAssetPath:
          'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite' },
        runningMode: 'VIDEO', minDetectionConfidence: 0.5 });
      try { detector = await FaceDetector.createFromOptions(files, opts('GPU')); }
      catch { detector = await FaceDetector.createFromOptions(files, opts('CPU')); }
    }
    headOn = true; headBtn.classList.add('on'); headBtn.textContent = 'Head';
  } catch (err) {
    console.warn('Head tracking failed:', err);
    stopHead();
    headBtn.textContent = 'Head ✕'; // camera denied/unavailable or the model failed to load
  }
  headLoading = false;
}

function stopHead() {
  headOn = false;
  stream?.getTracks().forEach(t => t.stop());
  stream = null; video = null; lastVideoTime = -1;
  headBtn.classList.remove('on'); headBtn.textContent = 'Head';
}

headBtn.addEventListener('click', () => { if (!headLoading) headOn ? stopHead() : startHead(); });

function screenHalfM() { return { w: (innerWidth / CSS_PX_PER_INCH) * 0.0254 / 2, h: (innerHeight / CSS_PX_PER_INCH) * 0.0254 / 2 }; }

// Find the eyes in the newest camera frame and turn them into a 3D position
function trackHead(now) {
  if (!headOn || !video || video.readyState < 2 || video.currentTime === lastVideoTime) return;
  lastVideoTime = video.currentTime;
  const det = detector.detectForVideo(video, now).detections?.[0];
  if (!det || det.keypoints.length < 2) return;
  const vw = video.videoWidth, vh = video.videoHeight;
  const [a, b] = det.keypoints; // the two eyes, in 0..1 image coordinates
  const ax = a.x * vw, ay = a.y * vh, bx = b.x * vw, by = b.y * vh;
  const gapPx = Math.hypot(ax - bx, ay - by);
  if (gapPx < 4) return;
  // Pinhole camera: focal length in pixels from the field of view; distance from the known eye gap
  const f = (Math.max(vw, vh) / 2) / Math.tan(THREE.MathUtils.degToRad(CAM_FOV_DEG / 2));
  const z = THREE.MathUtils.clamp(f * EYE_GAP_M / gapPx, 0.1, 1.2);
  const u = (ax + bx) / 2 - vw / 2, v = (ay + by) / 2 - vh / 2;
  // The front camera's image is un-mirrored: image right = phone's left, image down = phone's down
  const x = -u / f * z, y = -v / f * z;
  // Shift from the camera's position to the screen centre. In natural portrait the camera is just
  // above the screen's top edge; rotate that offset like the motion sensor when the screen turns.
  const s = screenHalfM();
  const camY = Math.max(s.w, s.h) + CAM_OFFSET_M;
  const th = screenAngle(), c = Math.cos(th), sn = Math.sin(th);
  eyeMeasured.set(x + (-sn * camY), y + (c * camY), z);
  eyeMeasured.x = THREE.MathUtils.clamp(eyeMeasured.x, -0.5, 0.5);
  eyeMeasured.y = THREE.MathUtils.clamp(eyeMeasured.y, -0.5, 0.5);
  lastFaceAt = now;
}

// Place the camera at the eye and skew the view so the screen is a window into the box
function updateView(realDt) {
  const faceFresh = headOn && performance.now() - lastFaceAt < 600;
  // Between camera frames, assume your head stays put while the phone turns: in phone coordinates
  // the eye then swings the opposite way. This keeps tilting smooth at the camera's low frame rate.
  if (headOn) {
    eye.addScaledVector(tmpE.crossVectors(omega, eye), -realDt);
    eyeMeasured.addScaledVector(tmpE.crossVectors(omega, eyeMeasured), -realDt);
  }
  eye.lerp(faceFresh ? eyeMeasured : eyeDefault, 1 - Math.exp(-realDt / EYE_SMOOTH_TC));

  const k = half.y / screenHalfM().h;    // world units per metre on screen
  const ex = eye.x * k, ey = eye.y * k, d = Math.max(eye.z * k, 0.5);
  camera.position.set(ex, ey, half.z + d); // the box's front opening is the plane z = half.z
  const n = camera.near, sc = n / d;
  camera.projectionMatrix.makePerspective(
    (-half.x - ex) * sc, (half.x - ex) * sc, (half.y - ey) * sc, (-half.y - ey) * sc, n, camera.far);
  camera.projectionMatrixInverse.copy(camera.projectionMatrix).invert();
}

// ---------- Loop ----------
const readout = document.getElementById('readout');
let last = performance.now();
function frame(now) {
  let dt = Math.min((now - last) / 1000, 1 / 20) * timeScale;
  last = now;
  // More substeps while spinning fast keeps the rotation forces stable
  const sub = Math.min(16, Math.max(4, Math.ceil(omega.length() * SPIN_SCALE * dt * 20)));
  for (let i = 0; i < sub; i++) step(dt / sub);
  updateBallMatrix();
  if (frameImpact > 0) { playBounce(frameImpact); frameImpact = 0; }
  updateRollSound();
  if (gotSensor) {
    const f = gTarget.length();
    const freeFall = f < 2.5; // < ~¼ g: the phone is falling or mid-toss
    readout.textContent = `force ${f.toFixed(1)} m/s² · spin ${omega.length().toFixed(1)} rad/s${freeFall ? ' · FREE FALL' : ''}`;
    readout.classList.toggle('ff', freeFall);
    if (headOn) readout.textContent += now - lastFaceAt < 600
      ? ` · eye ${(eye.x * 100).toFixed(0)}, ${(eye.y * 100).toFixed(0)}, ${(eye.z * 100).toFixed(0)} cm`
      : ' · no face';
  } else {
    readout.textContent = 'drag to tilt';
  }
  trackHead(now);
  updateView(dt / timeScale);
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

// ---------- Start / permissions ----------
const startEl = document.getElementById('start');
const msg = document.getElementById('msg');
document.getElementById('go').addEventListener('click', async () => {
  initAudio(); // must happen inside the tap, before any await, or iOS keeps audio locked
  try {
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      const res = await DeviceMotionEvent.requestPermission();   // iOS 13+
      if (res !== 'granted') { msg.textContent = 'Motion access denied — drag on screen to tilt instead.'; }
    }
  } catch (err) {
    msg.textContent = 'Could not get motion access (is the page on HTTPS?). Drag to tilt instead.';
  }
  addEventListener('devicemotion', onMotion);
  setTimeout(() => { startEl.style.display = 'none'; }, msg.textContent ? 1600 : 0);
});

const ballBtn = document.getElementById('ballBtn');
function showBall() { ballBtn.textContent = ballType.name; }
showBall();
ballBtn.addEventListener('click', () => {
  ballIndex = (ballIndex + 1) % BALLS.length;
  ballType = BALLS[ballIndex];
  const old = ball.material.map;
  ball.material.map = ballTexture();
  ball.material.needsUpdate = true;
  old.dispose();
  showBall();
  try { localStorage.setItem('gyrobox-ball', String(ballIndex)); } catch {}
});

const muteBtn = document.getElementById('mute');
muteBtn.addEventListener('click', () => {
  soundOn = !soundOn;
  muteBtn.classList.toggle('on', soundOn);
  initAudio();
  if (master) master.gain.setTargetAtTime(soundOn ? 1 : 0, actx.currentTime, 0.02);
});
// Browsers may suspend audio when the tab is backgrounded; wake it on the next touch
addEventListener('pointerdown', () => { if (actx && actx.state !== 'running') actx.resume(); });

const scaleIn = document.getElementById('scale'), scaleVal = document.getElementById('scaleVal');
function showScale() {
  const cm = (innerHeight / CSS_PX_PER_INCH) * 2.54 * boxSize;
  scaleVal.textContent = `×${boxSize} (${cm.toFixed(0)} cm)`;
}
scaleIn.value = boxSize; showScale();
scaleIn.addEventListener('input', () => {
  boxSize = parseFloat(scaleIn.value); updateScale(); showScale();
  try { localStorage.setItem('gyrobox-size', String(boxSize)); } catch {}
});
addEventListener('resize', showScale);

const timeIn = document.getElementById('time'), timeVal = document.getElementById('timeVal');
function showTime() { timeVal.textContent = timeScale === 1 ? 'real time' : `×${timeScale.toFixed(2)}`; }
timeIn.value = timeScale; showTime();
timeIn.addEventListener('input', () => {
  timeScale = parseFloat(timeIn.value); showTime();
  try { localStorage.setItem('gyrobox-time', String(timeScale)); } catch {}
});

const flipBtn = document.getElementById('flip');
flipBtn.addEventListener('click', () => { invert = !invert; flipBtn.classList.toggle('on', invert); });
document.getElementById('reset').addEventListener('click', () => { pos.set(0, 0, 0); vel.set(0, 0, 0); squash.set(0, 0, 0); squashVel.set(0, 0, 0); stretch = 0; spin.set(0, 0, 0); });

addEventListener('resize', resize);
screen.orientation?.addEventListener?.('change', resize);
resize();
requestAnimationFrame(frame);
</script>
</body>
